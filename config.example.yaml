# config.example.yaml 을 config.yaml 로 복사한 뒤 수정하세요.
# 프로젝트 폴더는 이 파일이 있는 폴더입니다 (data/, state/, output/ 이 여기 생깁니다).

naver:
  blog_id: "my_blog_id"          # blog.naver.com/<blog_id>
  # review  : 글·사진·태그·발행 설정까지 채우고 멈춤 → 직접 확인 후 [발행]/[예약] 클릭 (권장)
  # draft   : 채운 뒤 네이버 [임시저장]까지 → 임시저장함에서 열어 직접 예약 발행
  # publish : [발행]까지 자동. 네이버 이용약관이 '자동화된 수단으로 게시물 게재'를 금지하므로
  #           제재 위험이 가장 큽니다. 쓰려면 아래 allow_auto_publish 도 true 로 바꿔야 합니다.
  mode: review
  allow_auto_publish: false
  category: ""                    # 발행할 카테고리 이름 (비우면 블로그 기본 카테고리)
  browser_channel: ""             # "chrome" 이면 설치된 크롬 사용. 비우면 playwright 크로미움
  # insert: 문단을 한 번에 입력 / type: 한 글자씩 입력 (에디터가 빠른 입력을 놓치면 자동으로 type 으로 바뀜)
  input_method: insert
  type_delay_ms: 15
  # SmartEditor 화면이 바뀌어 자동 입력이 어긋나면 여기서 셀렉터를 덮어씁니다.
  # 값은 문자열 또는 목록(앞에서부터 시도). 기본값은 blogbot/publisher.py 의 DEFAULT_SELECTORS.
  selectors: {}

business:
  name: "내 가게/브랜드 이름"
  # 글쓴이와 사업의 관계: owner(운영자) / employee(직원) / sponsored(협찬·대가 받음) / none
  relationship: owner
  # 공정위 추천·보증 심사지침: 경제적 이해관계는 '제목 또는 본문 첫 부분'에 밝혀야 합니다.
  # 여기에 적으면 코드가 본문 맨 앞에 넣습니다. (예: "제가 운영하는 가게 이야기입니다.")
  # 협찬 글이면 반드시 적어야 발행됩니다. 문구의 법적 적정성은 직접 판단해 주세요.
  disclosure: ""
  description: |
    어떤 제품/서비스인지, 누구를 위한 것인지, 강점은 무엇인지 적어주세요.
    AI 는 이 정보와 --notes 밖의 사실(가격, 효능 등)을 쓰지 않습니다.
  topics: ["카페", "디저트"]      # 블로그가 꾸준히 다루는 주제 (한 주제에 집중할수록 유리)
  facts:                          # 글에 써도 되는 확정 정보
    - "영업시간: 평일 10:00~19:00"
  # 이웃추가·공감 요구는 네이버가 어뷰징으로 분류합니다. 네이버 안에서 끝나는 안내만 쓰세요.
  call_to_action: "궁금한 점은 댓글이나 네이버 톡톡으로 편하게 물어봐 주세요."

writing:
  model: claude-opus-5-5          # 매일 쓰는 글
  learn_model: claude-opus-5-5    # 문체 학습 (가끔 한 번). claude-fable-5-1 로 바꾸면 더 정교하지만 약 2.5배 비용
  photo_model: claude-opus-5-5    # 사진 설명
  effort: high                    # low / medium / high / xhigh / max
  learn_effort: high
  revise_effort: medium
  review_passes: 1                # 검사 결과를 보고 편집자가 한 번 더 다듬는 횟수 (0 이면 끔)
  learn_max_docs: 60              # 문체 학습에 쓸 최근 원고 수 (통계는 전체 사용)
  examples_per_prompt: 3          # 참고 원고 수 (주제가 비슷한 1편 + 주제가 다른 최근 글)
  # 분량(공백 제외). 네이버 공식 기준은 없고 상위 글도 수백~수천 자로 다양합니다. 범위 밖이면 경고만.
  # 가장 좋은 기준은 내 키워드로 검색했을 때 상위 글 5~7개의 분량·사진 수를 직접 보고 맞추는 것입니다.
  length_no_space: {min: 800, target: 1500, max: 4000}
  images_per_post: 6
  min_images: 3
  max_photo_candidates: 30
  # 과거 글 한 편과 이 비율 이상 겹치면 발행을 막습니다 (유사문서 방지)
  max_overlap_ratio: 0.15
  banned_phrases: []              # 추가로 쓰지 않을 표현
  legal_watchlist: []             # 추가로 확인할 표시광고 관련 단어

images:
  # data/photos 의 사진이 예전에 블로그에 이미 올렸던 사진이면 true.
  # 네이버 유사문서 판정은 사진도 비교하므로, 이 사진들은 '이미 1번 쓴 사진'으로 계산합니다.
  archive_already_published: true
  max_reused_per_post: 1          # 한 글에 넣을 수 있는 예전 사진 수
  reuse_cooldown_days: 90
  max_uses_per_photo: 2
  max_long_side: 2000             # 긴 변 최대 픽셀 (작은 사진은 확대하지 않음)
  min_width: 800
  jpeg_quality: 92
  watermark_text: ""              # 예: "@my_blog_id" (작게, 오른쪽 아래)
  watermark_logo: ""              # 예: "data/logo.png"
  watermark_font: ""              # 한글 워터마크용 폰트 파일 경로 (못 찾으면 워터마크 생략)

schedule:
  # 발행량 제한은 명령행 옵션으로 넘길 수 없습니다. 바꾸려면 여기서 직접 바꾸세요.
  max_posts_per_day: 1            # 최근 24시간 기준
  max_posts_per_week: 4           # 최근 7일 기준
  min_interval_hours: 20
  halt_after_missing: 2           # check 에서 연속으로 검색 누락이면 발행 중단
